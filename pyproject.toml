[project]
name = "escruta-helper"
version = "0"
readme = "README.md"
authors = [{ name = "Francisco Mesa", email = "hola@francids.com" }]
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "curl-cffi>=0.17.0",
  "ddgs>=9.16.1",
  "fastapi[standard]>=0.162.0",
  "markitdown[audio-transcription,docx,pdf,pptx,xls,xlsx,youtube-transcription]>=0.1.9",
  "pymupdf4llm>=2.1",
  "python-multipart>=0.0.33",
  "trafilatura>=2.3.1",
  "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = ["ruff>=0.17.3", "ty>=0.0.96"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]
